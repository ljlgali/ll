[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "1.0.0"
description = "Stateless MCP 2026-07-28 adapter exposing the Go Pet Hospital REST API to AI agents (list_pets tool)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pet Hospital MCP" }]
dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "structlog>=24.1",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "asgi-lifespan>=2.1",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
